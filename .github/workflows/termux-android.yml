name: Termux / Android

# Cross-compiles herdr for Termux (aarch64-linux-android) on a normal runner:
# the Android NDK supplies bionic for both zig's libghostty-vt build and rustc's
# link step, so no rooted device is involved. Pushing a `termux-*` tag publishes
# the binary and its checksum as a release, which is the no-root install path.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["termux-*"]

permissions:
  contents: write

concurrency:
  group: termux-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: 29
  NDK_VERSION: r27c
  RUST_TOOLCHAIN: 1.96.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust for aarch64-linux-android
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-linux-android

      - name: Install Zig 0.16.0
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /opt
          ndk="/opt/android-ndk-${NDK_VERSION}"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_TOOLCHAIN=$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          # These have to be exported, not written to $GITHUB_ENV: a variable
          # added to GITHUB_ENV only reaches later steps, and without a linker
          # rustc falls back to the host ld (Relocations in generic ELF (EM: 183)).
          clang="$NDK_TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="$clang"
          export AR_aarch64_linux_android="$NDK_TOOLCHAIN/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_TOOLCHAIN/bin/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$clang"
          # Android 15+ devices can use 16 KiB pages.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo +"$RUST_TOOLCHAIN" build --release --locked --target aarch64-linux-android

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/herdr dist/herdr
          "$NDK_TOOLCHAIN/bin/llvm-strip" dist/herdr
          (cd dist && sha256sum herdr > herdr.sha256)
          file dist/herdr
          ls -lh dist

      - name: Check it is a bionic binary
        run: |
          readelf -d dist/herdr | grep NEEDED
          readelf -d dist/herdr | grep -q 'Shared library: \[libc.so\]'
          ! readelf -d dist/herdr | grep -q 'libc++\|libgcc\|libstdc++'

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-aarch64-linux-android
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/termux-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            herdr for Termux / Android (aarch64-linux-android), cross-compiled from
            ${{ github.sha }}.

            install without root:

            ```bash
            curl -fsSL -o ~/bin/herdr \
              https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/herdr
            chmod +x ~/bin/herdr
            herdr --version
            ```
